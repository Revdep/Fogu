name: release
on:
  push:
    tags: ["v*"]
env:
  CARGO_TERM_COLOR: always
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: macos-15
            name: macos-aarch64
          - os: macos-15-intel
            name: macos-x86_64
          - os: windows-2025
            name: windows-x86_64
            rustflags: -C target-feature=+crt-static
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: validate tag
        run: |
          mkdir -p target/updater-e2e
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: embed current dependency licenses
        run: |
          cargo install --locked --features cli cargo-about@0.9.2
          cargo about generate --locked -m crates/app/Cargo.toml about.hbs -o THIRD_PARTY_CRATES
          # The binary embeds exactly the list this archive ships (`fogu --licenses`, About), so
          # a stale or differently generated assets/updater/notices.gz never reaches a release.
          # CRs dropped: Windows checks out with CRLF line ends.
          tr -d '\r' < THIRD_PARTY_CRATES | gzip -9 -n > assets/updater/notices.gz
      - name: Linux build on glibc 2.28
        if: runner.os == 'Linux'
        env:
          # First public cycle is manual; automatic needs a successful public N-1 → N gate.
          FOGU_UPDATER: manual
        run: |
          scripts/package-linux.sh
          mkdir -p target/release
          cp target/compat/release/fogu target/release/fogu
          cp dist/Fogu-linux-x86_64.tar.gz .
          test "$(stat -c %s target/release/fogu)" -le 21000000
      - name: build native artifacts
        if: runner.os != 'Linux'
        run: cargo build --release --locked -p fogu
        env:
          FOGU_UPDATER: manual
          RUSTFLAGS: ${{ matrix.rustflags }}
      - name: validate executable
        run: |
          test "$(target/release/fogu --version)" = "fogu ${GITHUB_REF_NAME#v}"
          target/release/fogu --licenses > target/updater-e2e/embedded-licenses.txt
      - name: assemble macOS bundle
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh target/release/fogu target/updater-e2e/Fogu.app
      - name: package macOS
        if: runner.os == 'macOS'
        run: |
          test "$(target/updater-e2e/Fogu.app/Contents/MacOS/fogu --version)" = "fogu ${GITHUB_REF_NAME#v}"
          ditto -c -k --keepParent target/updater-e2e/Fogu.app "Fogu-${{ matrix.name }}.zip"
      - name: package Windows
        if: runner.os == 'Windows'
        run: |
          test "$(target/release/fogu.exe --version)" = "fogu ${GITHUB_REF_NAME#v}"
          d=Fogu-windows-x86_64
          mkdir -p "$d/assets/fonts"
          cp target/release/fogu.exe LICENSE README.md THIRD_PARTY_LICENSES THIRD_PARTY_CRATES "$d/"
          cp assets/fonts/*-LICENSE.txt "$d/assets/fonts/"
          7z a "$d.zip" "$d"
      - name: AppImage and signed-archive layout
        if: runner.os == 'Linux'
        run: |
          scripts/package-appimage.sh
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 ./Fogu-x86_64.AppImage --version)" = "fogu ${GITHUB_REF_NAME#v}"
          tar czf Fogu-linux-appimage-x86_64.tar.gz Fogu-x86_64.AppImage
      - name: AppImage starts on a bare system
        if: runner.os == 'Linux'
        run: scripts/appimage-smoke.sh Fogu-x86_64.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: Fogu-${{ matrix.name }}
          path: |
            Fogu-*.tar.gz
            Fogu-*.zip
            Fogu-*.AppImage
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-24.04
    # Configure this environment with required human approval and the signing secret.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: target/updater-e2e/release
          merge-multiple: true
      - name: release notes from CHANGELOG.md
        run: |
          # The "## <version>" section, up to the next "## ".
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{on = ($2 == v || $2 == "[" v "]")} on' CHANGELOG.md \
            > target/updater-e2e/release/release-notes.md
          test -s target/updater-e2e/release/release-notes.md || { echo "CHANGELOG.md has no ${GITHUB_REF_NAME#v} section"; exit 1; }
      - name: sign
        env:
          SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY_BASE64 }}
        run: |
          active=$(grep -v '^#' assets/updater/active.pub); reserve=$(grep -v '^#' assets/updater/reserve.pub)
          ! grep -q PLACEHOLDER assets/updater/*.pub || { echo "Replace BOTH placeholder keys before publishing"; exit 1; }
          [ "$active" != "$reserve" ] || { echo "The offline reserve must be a different key"; exit 1; }
          cargo install --locked zipsign --version 0.2.2
          cd target/updater-e2e/release
          umask 077
          base64 -d <<< "$SIGNING_KEY" > key
          for archive in Fogu-*.tar.gz; do zipsign sign tar "$archive" key; done
          for archive in Fogu-*.zip; do zipsign sign zip "$archive" key; done
          rm key
          sha256sum Fogu-*.tar.gz Fogu-*.zip Fogu-*.AppImage > SHA256SUMS
      - name: verify through the client
        env:
          FOGU_UPDATER: manual
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev libxkbcommon-dev libwayland-dev
          cargo build --locked -p fogu
          # With the keys built into Fogu, as a user's copy checks them.
          APPIMAGE_EXTRACT_AND_RUN=1 target/debug/fogu --updater-test-verify target/updater-e2e/release "${GITHUB_REF_NAME#v}"
      - uses: actions/attest@v4
        with:
          subject-path: target/updater-e2e/release/Fogu-*
      - name: draft, re-download, verify, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd target/updater-e2e/release
          gh release create "$GITHUB_REF_NAME" Fogu-*.tar.gz Fogu-*.zip Fogu-*.AppImage SHA256SUMS --draft --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md
          mkdir ../downloaded
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir ../downloaded
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > ../downloaded/release-notes.md
          cd ../../..
          APPIMAGE_EXTRACT_AND_RUN=1 target/debug/fogu --updater-test-verify target/updater-e2e/downloaded "${GITHUB_REF_NAME#v}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
