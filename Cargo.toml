[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/term",
    "crates/session",
    "crates/ui",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.8"

[workspace.dependencies]
# why: the GUI toolkit, pinned exactly (it breaks between minors). `advanced` for the terminal
# widget; no codecs (we decode, bounded); no desktop-theme detection (it pulls mundy + zbus).
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "x11", "wayland", "advanced", "image-without-codecs"] }
# why: rasterizes the title-bar icons; already in the tree as iced's software renderer
tiny-skia = { version = "=0.11.4", default-features = false, features = ["std", "simd"] }
# why: structured logging
tracing = "0.1.44"
# why: login-script patterns: linear time with a size limit, so a pattern can't stall a session
regex = "1.13.1"
# why: `RUST_LOG` filtering; `tracing-log` bridges dependencies' `log` records
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "tracing-log"] }
# why: async runtime for the sessions (`net` for russh)
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "process", "io-util", "time", "macros", "net", "fs"] }
# why: Unix PTYs, tokio-native, no `unsafe` in our code
pty-process = { version = "0.5.3", features = ["async"] }
# why: safe `dup`, `tcsetwinsize`, `getuid`, process-group kill, `uname`; already in the tree
rustix = { version = "1.1.5", features = ["termios", "process", "fs", "system"] }
# why: ConPTY for the Windows local session
portable-pty = "0.9.0"
# why: cheap shared buffers for session input
bytes = "1.12.1"
# why: typed error enums
thiserror = "2.0.21"
# why: the VT engine (parser, grid, scrollback, reflow)
alacritty_terminal = "0.26.0"
# why: snapshot tests (dev only)
insta = "1.49.0"
# why: config and profile (de)serialisation
serde = { version = "1.0.229", features = ["derive"] }
# why: the tab-recovery history file
serde_json = "1.0.154"
# why: the config format; `preserve_order` keeps the documented key order on write
toml = { version = "1.1.8", features = ["preserve_order"] }
# why: edits config.toml in place, keeping the user's comments and order
toml_edit = "0.25.17"
# why: `$XDG_CONFIG_HOME/fogu` on every Unix, macOS included (one documented path)
xdg = "3.0.0"
# why: platform config/state/home/download directories (XDG on Linux, known folders on Windows)
dirs = "7.0.0"

# why: the SSH client; `ring` instead of `aws-lc-rs` (banned in deny.toml), no `rsa`
# (RUSTSEC-2023-0071 has no fix: RSA private keys are refused in `ssh/auth.rs`).
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2"] }
# why: HMAC-SHA1 for hashed known_hosts entries; already russh's crypto backend
ring = "0.17.14"
# why: SFTP on a channel of the existing SSH connection
russh-sftp = "3.0.1"
# why: `CancellationToken` for transfer cancel; already in the tree
tokio-util = { version = "0.7.20", default-features = false }
# why: secrets only in `SecretString` (zeroed on drop, redacted `Debug`)
secrecy = "0.10.3"
# why: Secret Service passwords over D-Bus only (never a file fallback); pure-Rust crypto
oo7 = { version = "0.6.0", default-features = false, features = ["tokio", "native_crypto"] }
# why: macOS Keychain passwords
security-framework = "3.7.0"
# why: Windows Credential Manager passwords
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

# why: Windows only: file DACLs and the agent pipe owner (`fogu_core::winsec`); already in the tree
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

# why: native file pickers; `xdg-portal` only (no GTK)
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
# why: open a path or URL with the desktop's default application
open = "5.4.4"
# why: tab background images with size limits; the same 0.25 iced uses, PNG/JPEG/WebP only
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }


# why: the updater's Ed25519 archive signatures (the format the `zipsign` CLI writes in release CI)
zipsign-api = { version = "0.2.2", default-features = false }
# why: release tags and the release's "upgrade from" ranges
semver = { version = "1.0.28", features = ["serde"] }
# why: updater archives (.tar.gz on Linux, .zip on macOS/Windows); flate2 already comes with russh
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
# why: Windows can't rename over a running exe; this moves it aside first
self-replace = "1.5.0"

[workspace.lints.rust]
# `deny`, not `forbid`: `fogu_core::winsec` (Windows only) is the one module allowed to opt out.
unsafe_code = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
undocumented_unsafe_blocks = "deny"
redundant_clone = "warn"
# pedantic noise we accept:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
# "s": -8 MB against 3, feed throughput -1% and first frame unchanged (scripts/metrics.sh)
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "symbols"
debug = false

# The terminal engine stays at 3: "s" cost it ~10% of feed throughput.
[profile.release.package.alacritty_terminal]
opt-level = 3
[profile.release.package.vte]
opt-level = 3
[profile.release.package.fogu-term]
opt-level = 3

[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"
debug = "line-tables-only"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2
