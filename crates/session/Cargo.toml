[package]
name = "fogu-session"
edition.workspace = true
license.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
fogu-core = { path = "../core" }
fogu-term = { path = "../term" }
tokio.workspace = true
pty-process.workspace = true
rustix.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true
russh = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
secrecy.workspace = true
oo7 = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["ssh"]
# The SSH transport (`run_ssh`). Off = local shells only, no russh in the tree.
# Tests only: `SecretStore::InMemory` for the integration tests.
test-store = []
ssh = [
    "dep:russh",
    "dep:ring",
    "dep:russh-sftp",
    "dep:tokio-util",
    "dep:oo7",
    "dep:security-framework",
    "dep:serde_json",
]

[[example]]
name = "ssh_probe"
required-features = ["ssh"]

[dev-dependencies]
fogu-session = { path = ".", features = ["test-store"] }
